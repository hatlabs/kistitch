name: PR checks

# No branch filter: a PR stacked on another branch gets checked before it is
# retargeted to main.
on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    uses: halos-org/shared-workflows/.github/workflows/checks.yml@v1.0.0-rc.1

  build:
    uses: ./.github/workflows/build.yml

  # Branch protection should require only this job. List every other job in
  # needs, including jobs defined in this file.
  status:
    needs: [checks, build]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$NEEDS"
