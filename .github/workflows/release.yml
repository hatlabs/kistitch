# The PyPI project's trusted publisher must name this file, release.yml.
#
# On a published stable release: check the release, build and smoke-test the
# wheel and the sdist (build.yml), then upload them. Only the upload job
# holds the OIDC token; nothing it runs comes from the build.
name: Publish stable release

on:
  release:
    types: [published]

permissions:
  contents: read

# Run steps with -eo pipefail rather than the implicit bash -e.
defaults:
  run:
    shell: bash

jobs:
  check:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a commit on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"; then
            echo "::error::Release commit $(git rev-parse HEAD) is not on $DEFAULT_BRANCH"
            exit 1
          fi

      - uses: ./.github/actions/check-versions

      - name: Check the release
        id: check
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          # Stable tag format written by release-version.yml.
          if ! [[ $TAG =~ ^v([0-9][0-9A-Za-z.~-]*)\+([0-9]+)$ ]]; then
            echo "::error::Release tag $TAG is not a v<upstream>+<N> stable tag"
            exit 1
          fi
          if [ "${BASH_REMATCH[1]}" != "$VERSION" ]; then
            echo "::error::Release $TAG is for ${BASH_REMATCH[1]}, but VERSION at that commit is $VERSION"
            exit 1
          fi

          # A version with only some of its files on PyPI fails rather than
          # uploading: another release of the same VERSION may be another
          # commit, and skip-existing compares names, not contents.
          URL="https://pypi.org/pypi/kistitch/$VERSION/json"
          STATUS=$(curl -sS --max-time 30 --retry 3 --retry-all-errors -o pypi.json -w '%{http_code}' "$URL")
          case "$STATUS" in
            200)
              if jq -e '[.urls[].packagetype] | index("bdist_wheel") and index("sdist")' pypi.json > /dev/null; then
                echo "::warning::kistitch $VERSION is already on PyPI; nothing to publish. Bump VERSION to release a new version."
                echo "publish=false" >> "$GITHUB_OUTPUT"
              else
                echo "::error::kistitch $VERSION is on PyPI without both its wheel and its sdist. Use Re-run failed jobs on the release run that uploaded it, which uploads the rest from that run's build."
                exit 1
              fi
              ;;
            404)
              echo "kistitch $VERSION is not on PyPI; publishing"
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::PyPI answered $STATUS for kistitch $VERSION"
              exit 1
              ;;
          esac

  build:
    needs: check
    if: needs.check.outputs.publish == 'true'
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: ${{ github.repository }}-publish-pypi
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # Re-run failed jobs reruns only this job, with this run's build, and
      # finishes an upload that stopped partway.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
